name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Optional project requirements if present
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Minimal runtime deps used in code paths and tests
          pip install requests beautifulsoup4 selenium webdriver-manager pillow

      - name: Compile (syntax check)
        run: |
          python -m py_compile deck_analyzer.py tests/test_deck_analyzer.py

      - name: Run unit tests
        run: |
          # Prefer discovery; fallback to direct test if matcher fails
          python -m unittest discover -s tests -p "test*.py" -v || python tests/test_deck_analyzer.py

